name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: PORT=19477 BASE_PATH=/ pnpm --filter @workspace/navigated run build

      - name: Install Capacitor CLI & Android
        working-directory: artifacts/navigated
        run: |
          pnpm add -D @capacitor/cli @capacitor/core @capacitor/android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Add Android platform
        working-directory: artifacts/navigated
        run: npx cap add android

      - name: Sync web assets to Android
        working-directory: artifacts/navigated
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x artifacts/navigated/android/gradlew

      - name: Build debug APK
        working-directory: artifacts/navigated/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build debug AAB
        working-directory: artifacts/navigated/android
        run: ./gradlew bundleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigated-debug.apk
          path: artifacts/navigated/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigated-debug.aab
          path: artifacts/navigated/android/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
