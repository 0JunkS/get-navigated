name: Android CI & Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# GitHub Release 및 태그 생성에 필요한 권한 설정
permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # 2. pnpm
      # ----------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ----------------------------------------
      # 3. Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # ----------------------------------------
      # 4. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ----------------------------------------
      # 5. Build web app
      # ----------------------------------------
      - name: Build web app
        run: PORT=19477 BASE_PATH=/ pnpm --filter @workspace/navigated run build

      # ----------------------------------------
      # 6. Install Capacitor
      # ----------------------------------------
      - name: Install Capacitor CLI & Android
        working-directory: artifacts/navigated
        run: |
          pnpm add -D @capacitor/cli @capacitor/core @capacitor/android

      # ----------------------------------------
      # 7. Java 21
      # ----------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ----------------------------------------
      # 8. Add Android platform (안전하게 체크 후 추가)
      # ----------------------------------------
      - name: Add Android platform
        working-directory: artifacts/navigated
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ----------------------------------------
      # 9. Sync web → Android
      # ----------------------------------------
      - name: Sync web assets to Android
        working-directory: artifacts/navigated
        run: npx cap sync android

      # ----------------------------------------
      # 10. Gradle permission
      # ----------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x artifacts/navigated/android/gradlew

      # ----------------------------------------
      # 11. Build APK
      # ----------------------------------------
      - name: Build debug APK
        working-directory: artifacts/navigated/android
        run: ./gradlew assembleDebug --no-daemon

      # ----------------------------------------
      # 12. Build AAB
      # ----------------------------------------
      - name: Build debug AAB
        working-directory: artifacts/navigated/android
        run: ./gradlew bundleDebug --no-daemon

      # ----------------------------------------
      # 13. Release 파일 준비
      # ----------------------------------------
      - name: Prepare release files
        run: |
          mkdir -p release-files

          cp artifacts/navigated/android/app/build/outputs/apk/debug/*.apk \
            release-files/app-release.apk

          cp artifacts/navigated/android/app/build/outputs/bundle/debug/*.aab \
            release-files/app-release.aab

          ls -lh release-files

      # ----------------------------------------
      # 14. Actions Artifact 업로드
      # ----------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigated-debug.apk
          path: release-files/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigated-debug.aab
          path: release-files/app-release.aab
          if-no-files-found: error

      # ----------------------------------------
      # 15. 다음 버전 번호 계산 (git 태그 및 gh release 대조)
      # ----------------------------------------
      - name: Calculate next release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking existing releases & git tags..."
          git fetch --tags || true

          MAX_GIT_TAG=$(git tag -l "v*" | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)

          RELEASES=$(gh release list \
            --repo "${GITHUB_REPOSITORY}" \
            --limit 1000 \
            --json tagName \
            --jq '.[].tagName' 2>/dev/null || true)

          MAX_GH_RELEASE=$(echo "$RELEASES" | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)

          MAX_VERSION=0
          if [ -n "$MAX_GIT_TAG" ] && [ "$MAX_GIT_TAG" -gt "$MAX_VERSION" ]; then
            MAX_VERSION=$MAX_GIT_TAG
          fi
          if [ -n "$MAX_GH_RELEASE" ] && [ "$MAX_GH_RELEASE" -gt "$MAX_VERSION" ]; then
            MAX_VERSION=$MAX_GH_RELEASE
          fi

          NEXT_VERSION=$((MAX_VERSION + 1))
          TAG="v${NEXT_VERSION}"

          echo "Latest version: v${MAX_VERSION}"
          echo "Next version:   ${TAG}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # 16. GitHub Release 및 태그 자동 생성 (softprops/action-gh-release)
      # ----------------------------------------
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "3D Escape ${{ steps.version.outputs.tag }}"
          files: |
            release-files/app-release.apk
            release-files/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
