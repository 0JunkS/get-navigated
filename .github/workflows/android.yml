name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# GitHub Release 생성에 필요
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # 2. pnpm
      # ----------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ----------------------------------------
      # 3. Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # ----------------------------------------
      # 4. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # ----------------------------------------
      # 5. Build web app
      # ----------------------------------------
      - name: Build web app
        run: PORT=19477 BASE_PATH=/ pnpm --filter @workspace/navigated run build

      # ----------------------------------------
      # 6. Install Capacitor
      # ----------------------------------------
      - name: Install Capacitor CLI & Android
        working-directory: artifacts/navigated
        run: |
          pnpm add -D @capacitor/cli @capacitor/core @capacitor/android

      # ----------------------------------------
      # 7. Java 21
      # ----------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      # ----------------------------------------
      # 8. Add Android platform
      # ----------------------------------------
      - name: Add Android platform
        working-directory: artifacts/navigated
        run: npx cap add android

      # ----------------------------------------
      # 9. Sync web → Android
      # ----------------------------------------
      - name: Sync web assets to Android
        working-directory: artifacts/navigated
        run: npx cap sync android

      # ----------------------------------------
      # 10. Gradle permission
      # ----------------------------------------
      - name: Grant execute permission for gradlew
        run: chmod +x artifacts/navigated/android/gradlew

      # ----------------- -----------------------
      # 11. Build APK
      # ----------------------------------------
      - name: Build debug APK
        working-directory: artifacts/navigated/android
        run: ./gradlew assembleDebug --no-daemon

      # ----------------------------------------
      # 12. Build AAB
      # ----------------------------------------
      - name: Build debug AAB
        working-directory: artifacts/navigated/android
        run: ./gradlew bundleDebug --no-daemon

      # ----------------------------------------
      # 13. Rename files
      #
      # Release에서 예전처럼
      # app-release.apk
      # app-release.aab
      # 이름으로 보이게 함
      # ----------------------------------------
      - name: Prepare release files
        run: |
          mkdir -p release-files

          cp artifacts/navigated/android/app/build/outputs/apk/debug/*.apk \
            release-files/app-release.apk

          cp artifacts/navigated/android/app/build/outputs/bundle/debug/*.aab \
            release-files/app-release.aab

          ls -lh release-files

      # ----------------------------------------
      # 14. Actions Artifact도 유지
      # ----------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigated-debug.apk
          path: release-files/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigated-debug.aab
          path: release-files/app-release.aab
          if-no-files-found: error

      # ----------------------------------------
      # 15. 다음 버전 번호 계산
      #
      # 예:
      # v198 존재
      # ↓
      # v199 생성
      #
      # v199 존재
      # ↓
      # v200 생성
      # ----------------------------------------
      - name: Calculate next release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking existing releases..."

          RELEASES=$(gh release list \
            --repo "${GITHUB_REPOSITORY}" \
            --limit 1000 \
            --json tagName \
            --jq '.[].tagName' || true)

          MAX_VERSION=$(echo "$RELEASES" \
            | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' \
            | sort -n \
            | tail -1)

          if [ -z "$MAX_VERSION" ]; then
            MAX_VERSION=0
          fi

          NEXT_VERSION=$((MAX_VERSION + 1))

          TAG="v${NEXT_VERSION}"

          echo "Latest version: v${MAX_VERSION}"
          echo "Next version:   ${TAG}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # 16. GitHub Release 생성
      #
      # Push 때만 실행
      # ----------------------------------------
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            release-files/app-release.apk \
            release-files/app-release.aab \
            --repo "${GITHUB_REPOSITORY}" \
            --title "3D Escape ${TAG}" \
            --generate-notes
