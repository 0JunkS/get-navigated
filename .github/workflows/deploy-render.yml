name: Deploy to Render

on:
  push:
    branches:
      - just-system-rework

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set; skipping manual Render deploy hook."
            exit 0
          fi
          curl -fsS "$RENDER_DEPLOY_HOOK_URL" -X POST -d ""
